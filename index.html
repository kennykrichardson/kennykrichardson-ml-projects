<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Legacy-host fallback redirect.
         Configure a real HTTP 301 redirect at the hosting layer as well. -->
    <script>
      if (window.location.hostname === "kennykrichardson-ml.onrender.com") {
        window.location.replace(
          "https://ml.kennykrichardson.com" +
          window.location.pathname +
          window.location.search +
          window.location.hash
        );
      }
    </script>

    <!-- Google Search Console verification -->
    <meta
      name="google-site-verification"
      content="wdpJILycECpySr05_4fzGhK5r75ombkyNRIyUVb9jv8"
    />

    <!-- Primary SEO -->
    <title>Kenny Richardson • ML Projects</title>
    <meta
      name="description"
      content="Explore machine learning experiments, research notebooks, simulations, and engineering projects by Kenny Richardson."
    />
    <meta
      name="keywords"
      content="Kenny Richardson, kennykrichardson, Kenny Richardson Kodipally, Machine Learning, Artificial Intelligence, ML Projects, Python, AI Engineering, Research Notebooks, Experiments"
    />
    <meta
      name="author"
      content="Kenny Richardson, kennykrichardson, Kenny Richardson Kodipally"
    />
    <meta name="creator" content="Kenny Richardson" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ml.kennykrichardson.com/" />

    <!-- Site icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon.png"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kenny Richardson's ML Projects" />
    <meta property="og:url" content="https://ml.kennykrichardson.com/" />
    <meta property="og:title" content="Kenny Richardson • ML Projects" />
    <meta
      property="og:description"
      content="Machine learning experiments, research notebooks, simulations, and engineering projects by Kenny Richardson."
    />
    <meta
      property="og:image"
      content="https://ml.kennykrichardson.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kenny Richardson's ML Projects"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kenny Richardson • ML Projects" />
    <meta
      name="twitter:description"
      content="Explore machine learning experiments, research notebooks, simulations, and engineering projects by Kenny Richardson."
    />
    <meta
      name="twitter:image"
      content="https://ml.kennykrichardson.com/og-image.png"
    />

    <script type="application/ld+json">

        "@context": "https://schema.org",
